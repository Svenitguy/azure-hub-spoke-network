name: 'Isolatietest OIDC Azure Verbinding'

on:
  push:
    branches: [ "feature/secure-oidc-cicd" ] # Draait alleen op jouw test-branch!

permissions:
  id-token: write # VERPLICHT: Vraagt het OIDC token aan bij GitHub
  contents: read

jobs:
  test-connection:
    name: 'Azure OIDC Handshake Validatie'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Microsoft's eigen inlog-actie gebruiken om OIDC te testen
    - name: Azure Login via OIDC
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.ARM_CLIENT_ID }}
        tenant-id: ${{ secrets.ARM_TENANT_ID }}
        subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

    # Als de inlog is gelukt, voeren we een gratis Azure CLI commando uit ter verificatie
    - name: Toon Actieve Azure Account
      run: |
        az account show
