name: 'Terraform CI/CD Pipeline'

on:
  push:
    branches: [ "main", "feature/secure-oidc-cicd" ]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - 'screenshots/**'

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: 'Terraform Validation & Deployment'
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./terraform

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_OIDC: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "1.9.5"

    - name: Terraform Format & Validate
      run: |
        terraform fmt -check
        terraform init -backend=false
        terraform validate

    - name: Run Trivy Security Scanner (IAC)
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'config'
        scan-ref: './terraform'
        hide-progress: false
        format: 'table'
        exit-code: '1'
        severity: 'HIGH,CRITICAL'

    - name: Terraform Init Remote
      run: terraform init

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan

    # FINOPS GUARDRAIL: Wijzigingen op main staan hier tijdelijk bevroren om ongewenste Azure kosten te voorkomen.
    - name: Terraform Apply (Frozen)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: echo "Uitvoering op main staat bewust bevroren. Er worden geen Azure resources aangemaakt of vernietigd."
